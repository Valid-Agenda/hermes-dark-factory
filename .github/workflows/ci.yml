name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Scan public release surface
        run: python scripts/public_release_scan.py
      - name: Compile Python sources
        run: python -m compileall -q plugin tests scripts
      - name: Validate JSON fixtures and manifests
        run: >-
          python -c "import json; from pathlib import Path; [json.loads(p.read_text(encoding='utf-8')) for p in Path('.').rglob('*.json') if '.git' not in p.parts]"

  javascript-syntax:
    name: Dashboard and desktop syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Check distributable JavaScript
        run: |
          node --check plugin/dashboard/dist/index.js
          node --check plugin/desktop/plugin.js
          node tests/desktop_plugin_contract.js plugin/desktop/plugin.js
